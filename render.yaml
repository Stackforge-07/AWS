databases:
  - name: skyguard-db
    plan: free
    databaseName: skyguard
    user: skyguard

services:
  # ── FastAPI backend ──
  - type: web
    name: skyguard-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skyguard-db
          property: connectionString
      - key: SKYGUARD_MODE
        value: simulation
      - key: SKYGUARD_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://skyguard-ui.onrender.com
      - key: PYTHON_VERSION
        value: "3.12"

  # ── React frontend (static site) ──
  - type: web
    name: skyguard-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://skyguard-api.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://skyguard-api.onrender.com/ws/*
      - type: rewrite
        source: /docs
        destination: https://skyguard-api.onrender.com/docs
      - type: rewrite
        source: /openapi.json
        destination: https://skyguard-api.onrender.com/openapi.json
      - type: rewrite
        source: /*
        destination: /index.html
