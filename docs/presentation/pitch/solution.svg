<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="735" viewBox="0 0 1080 735"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#4389BC"/></marker></defs><rect x="10" y="10" width="1060" height="105" rx="17" fill="#EAF4FF" stroke="#CFE0EF" stroke-width="2"/><text x="34" y="51" font-family="Arial,sans-serif" font-size="34" fill="#163852" font-weight="700">A sudden temperature jump. What caused it?</text><text x="34" y="88" font-family="Arial,sans-serif" font-size="23" fill="#55718B" font-weight="400">Illustrative example — a high reading alone is not proof of a fault.</text><path d="M540,115 V143" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="10" y="150" width="256" height="124" rx="17" fill="#F5F9FD" stroke="#CFE0EF" stroke-width="2"/><text x="25" y="186" font-family="Arial,sans-serif" font-size="23" fill="#1677C8" font-weight="700">01  HISTORY</text><text x="25" y="224" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">Did it jump, drift</text><text x="25" y="252" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">or stay stuck?</text><path d="M138,274 V294 H540 V313" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="278" y="150" width="256" height="124" rx="17" fill="#F5F9FD" stroke="#CFE0EF" stroke-width="2"/><text x="293" y="186" font-family="Arial,sans-serif" font-size="23" fill="#1677C8" font-weight="700">02  ML PATTERNS</text><text x="293" y="224" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">Is this combination</text><text x="293" y="252" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">unusual?</text><path d="M406,274 V294 H540 V313" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="546" y="150" width="256" height="124" rx="17" fill="#F5F9FD" stroke="#CFE0EF" stroke-width="2"/><text x="561" y="186" font-family="Arial,sans-serif" font-size="23" fill="#1677C8" font-weight="700">03  PHYSICS</text><text x="561" y="224" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">Do temperature, pressure</text><text x="561" y="252" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">and humidity agree?</text><path d="M674,274 V294 H540 V313" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="814" y="150" width="256" height="124" rx="17" fill="#F5F9FD" stroke="#CFE0EF" stroke-width="2"/><text x="829" y="186" font-family="Arial,sans-serif" font-size="23" fill="#1677C8" font-weight="700">04  VIRTUAL BUDDY</text><text x="829" y="224" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">Are nearby trusted</text><text x="829" y="252" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">stations changing too?</text><path d="M942,274 V294 H540 V313" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="225" y="320" width="630" height="76" rx="17" fill="#E3F5F0" stroke="#A7D8CD" stroke-width="2"/><text x="259" y="350" font-family="Arial,sans-serif" font-size="24" fill="#07856C" font-weight="700">COMBINE THE CLUES — EXPLAIN THE RESULT</text><text x="269" y="380" font-family="Arial,sans-serif" font-size="22" fill="#163852" font-weight="400">No single check decides the answer on its own.</text><path d="M540,396 V416 H176 V439" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="10" y="446" width="336" height="160" rx="17" fill="#EDF9F5" stroke="#CFE0EF" stroke-width="2"/><text x="27" y="482" font-family="Arial,sans-serif" font-size="25" fill="#058C72" font-weight="700">WEATHER SUPPORT</text><text x="27" y="515" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">Peers and related readings</text><text x="27" y="545" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">also show a consistent change.</text><text x="27" y="575" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">→ Keep weather context visible.</text><path d="M540,396 V416 H538 V439" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="446" width="336" height="160" rx="17" fill="#FFF1F3" stroke="#CFE0EF" stroke-width="2"/><text x="389" y="482" font-family="Arial,sans-serif" font-size="25" fill="#CE4C64" font-weight="700">FAULT SUPPORT</text><text x="389" y="515" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">An isolated jump or stuck</text><text x="389" y="545" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">sensor supports investigation.</text><text x="389" y="575" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">→ Raise a sensor incident.</text><path d="M540,396 V416 H900 V439" fill="none" stroke="#4389BC" stroke-width="3" marker-end="url(#a)"/><rect x="734" y="446" width="336" height="160" rx="17" fill="#F6F0FC" stroke="#CFE0EF" stroke-width="2"/><text x="751" y="482" font-family="Arial,sans-serif" font-size="25" fill="#8154B7" font-weight="700">EVIDENCE IS WEAK</text><text x="751" y="515" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">Missing or conflicting clues</text><text x="751" y="545" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">prevent a reliable conclusion.</text><text x="751" y="575" font-family="Arial,sans-serif" font-size="20" fill="#163852" font-weight="400">→ Send for human review.</text><rect x="10" y="637" width="1060" height="82" rx="17" fill="#F0F6FB" stroke="#CFE0EF" stroke-width="2"/><text x="35" y="671" font-family="Arial,sans-serif" font-size="24" fill="#163852" font-weight="700">OPERATOR STAYS IN CONTROL</text><text x="35" y="701" font-family="Arial,sans-serif" font-size="23" fill="#163852" font-weight="400">Review the evidence • Approve proposals separately • Never overwrite raw readings</text></svg>