<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="816" viewBox="0 0 1200 816"><style>text{font-family:Arial,sans-serif;fill:#111}</style><rect width="100%" height="100%" fill="white"/><text x="30" y="46" font-size="31" font-weight="700">A high reading is a question — not a verdict.</text><path d="M253,79 Q565.0,76 947,78 Q952,133.0 950,186 Q600.0,190 251,188 Q249,133.0 253,79" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M251,81 L949,80 L948,189" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="268" y="114" font-size="29" font-weight="700">A station reports a sudden temperature rise</text><text x="268" y="150" font-size="26" font-weight="400">Is it real weather, a sensor fault, or unclear evidence?</text><path d="M600,190 Q602.0,203.0 600,220" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,220 L594.7804135906653,209.19463477176788" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,220 L605.2195864093347,209.19463477176788" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21,231 Q137.25,228 280,230 Q285,305.0 283,378 Q150.5,382 19,380 Q17,305.0 21,231" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19,233 L282,232 L281,381" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="266" font-size="27" font-weight="700">History</text><text x="36" y="302" font-size="24" font-weight="400">Jump, drift</text><text x="36" y="334" font-size="24" font-weight="400">or stuck value?</text><path d="M150,382 Q377.0,415.0 600,452" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L588.5207536639031,455.49669895118296" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L590.1253276659198,445.1815803667895" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320,231 Q436.25,228 579,230 Q584,305.0 582,378 Q449.5,382 318,380 Q316,305.0 320,231" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M318,233 L581,232 L580,381" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="335" y="266" font-size="27" font-weight="700">ML patterns</text><text x="335" y="302" font-size="24" font-weight="400">Unusual combination</text><text x="335" y="334" font-size="24" font-weight="400">of T / P / RH?</text><path d="M449,382 Q526.5,415.0 600,452" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L588.0015194372078,452.1909559747651" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L592.3920439244789,442.7199674379374" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M619,231 Q735.25,228 878,230 Q883,305.0 881,378 Q748.5,382 617,380 Q615,305.0 619,231" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M617,233 L880,232 L879,381" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="634" y="266" font-size="27" font-weight="700">Physical checks</text><text x="634" y="302" font-size="24" font-weight="400">Are values physically</text><text x="634" y="334" font-size="24" font-weight="400">plausible together?</text><path d="M748,382 Q676.0,415.0 600,452" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L607.5362111656723,442.66161034940194" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L611.9995958894748,452.0984809082988" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M918,231 Q1034.25,228 1177,230 Q1182,305.0 1180,378 Q1047.5,382 916,380 Q914,305.0 918,231" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M916,233 L1179,232 L1178,381" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="933" y="266" font-size="27" font-weight="700">Virtual Buddy</text><text x="933" y="302" font-size="24" font-weight="400">Do trusted nearby</text><text x="933" y="334" font-size="24" font-weight="400">stations agree?</text><path d="M1047,382 Q825.5,415.0 600,452" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L609.8677180797952,445.17151994235286" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,452 L611.4828041034949,455.48499783655024" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M279,458 Q567.6,455 921,457 Q926,510.0 924,561 Q600.0,565 277,563 Q275,510.0 279,458" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M277,460 L923,459 L922,564" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="294" y="493" font-size="29" font-weight="700">Combine the available evidence</text><text x="294" y="529" font-size="26" font-weight="400">Explain the likely cause and the uncertainty.</text><path d="M600,565 Q401.0,585.0 198,609" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M198,609 L208.17331100308786,602.6357448798425" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M198,609 L209.30912382519094,613.0129438454205" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21,616 Q180.45000000000002,613 376,615 Q381,684.5 379,752 Q198.5,756 19,754 Q17,684.5 21,616" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19,618 L378,617 L377,755" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="651" font-size="28" font-weight="700">Weather supported</text><text x="36" y="687" font-size="25" font-weight="400">Keep the event visible.</text><text x="36" y="719" font-size="25" font-weight="400">Do not erase extremes.</text><path d="M600,565 Q601.5,585.0 599,609" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M599,609 L594.0272741856872,598.0788279944106" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M599,609 L604.4637519809949,598.3160206715768" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M422,616 Q581.45,613 777,615 Q782,684.5 780,752 Q599.5,756 420,754 Q418,684.5 422,616" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M420,618 L779,617 L778,755" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="437" y="651" font-size="28" font-weight="700">Fault supported</text><text x="437" y="687" font-size="25" font-weight="400">Raise an incident.</text><text x="437" y="719" font-size="25" font-weight="400">Inspect the sensor.</text><path d="M600,565 Q802.0,585.0 1000,609" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1000,609 L988.6887078166874,613.0068278155832" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1000,609 L989.8301319746406,602.6302445614629" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M823,616 Q982.45,613 1178,615 Q1183,684.5 1181,752 Q1000.5,756 821,754 Q819,684.5 823,616" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M821,618 L1180,617 L1179,755" fill="none" stroke="#111" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="838" y="651" font-size="28" font-weight="700">Evidence is weak</text><text x="838" y="687" font-size="25" font-weight="400">Ask for human review.</text><text x="838" y="719" font-size="25" font-weight="400">Do not force a verdict.</text><text x="99" y="797" font-size="27" font-weight="700">Raw readings stay unchanged. Correction proposals are stored separately.</text></svg>