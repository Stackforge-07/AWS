<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="735" viewBox="0 0 1040 735"><text x="20" y="40" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#163852">WHO BENEFITS — AND WHY</text><rect x="10" y="65" width="1020" height="140" rx="18" fill="#EEF6FE" stroke="#CFDFEC" stroke-width="2"/><circle cx="62" cy="112" r="30" fill="#157DC2"/><text x="45" y="122" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">01</text><text x="112" y="105" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#157DC2">STATION OPERATORS</text><text x="112" y="143" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#163852">Alerts + history + nearby context in one report</text><text x="112" y="181" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#157DC2">→ Less searching; clearer sensor investigations</text><rect x="10" y="221" width="1020" height="140" rx="18" fill="#EEF9F5" stroke="#CFDFEC" stroke-width="2"/><circle cx="62" cy="268" r="30" fill="#079A7C"/><text x="45" y="278" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">02</text><text x="112" y="261" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#079A7C">WEATHER-DATA TEAMS</text><text x="112" y="299" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#163852">Original readings + separate correction proposals</text><text x="112" y="337" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#079A7C">→ Traceable decisions; fewer unexplained edits</text><rect x="10" y="377" width="1020" height="140" rx="18" fill="#F6F1FC" stroke="#CFDFEC" stroke-width="2"/><circle cx="62" cy="424" r="30" fill="#8754BB"/><text x="45" y="434" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">03</text><text x="112" y="417" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#8754BB">DOWNSTREAM SERVICES</text><text x="112" y="455" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#163852">Quality flags and evidence for each suspect reading</text><text x="112" y="493" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#8754BB">→ Better-informed use of weather observations</text><rect x="10" y="548" width="1020" height="130" rx="18" fill="#F5F8FB" stroke="#CFDFEC" stroke-width="2"/><text x="34" y="584" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#163852">HOW WE WILL MEASURE THE PILOT</text><rect x="34" y="605" width="296" height="49" rx="18" fill="white" stroke="#CFDFEC" stroke-width="2"/><text x="53" y="638" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#256087">Review time</text><rect x="359" y="605" width="296" height="49" rx="18" fill="white" stroke="#CFDFEC" stroke-width="2"/><text x="378" y="638" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#256087">Missed faults</text><rect x="684" y="605" width="296" height="49" rx="18" fill="white" stroke="#CFDFEC" stroke-width="2"/><text x="703" y="638" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#256087">False alerts</text><text x="23" y="718" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#55718B">Expected benefits; real-world time, cost and quality gains still need validation.</text></svg>