services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skyguard
      POSTGRES_USER: skyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-skyguard-demo}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://skyguard:${POSTGRES_PASSWORD:-local-skyguard-demo}@database/skyguard
      SKYGUARD_MODE: ${SKYGUARD_MODE:-simulation}
      SKYGUARD_API_KEY: ${SKYGUARD_API_KEY:-}
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/openapi.json')"]
      start_period: 180s
      interval: 10s
      timeout: 5s
      retries: 10
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  database:
