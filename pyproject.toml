[project]
name = "skyguard"
version = "0.1.0"
description = "T/P/RH-only AWS intelligence and data trust platform"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2", "psycopg[binary]>=3.2,<4"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
